<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HtmlFormPractice</title>
  </head>
  <body>
    <header><h1>Student Enrolment Form</h1></header>
    <main>
      <h2>Create Your Account</h2>
      <form action="register" method="post">
        <fieldset>
          <legend>Personal Details</legend>
          <label for="fullname">Full Name:</label
          ><input type="text" id="fullname" name="fullname" required /><br />
          <label for="dob">Date Of Birth:</label
          ><input type="date" id="dob" name="dob" />
          <p>Gender:</p>
          <label for="gender"
            ><input type="radio" name="gender" value="m" />Male</label
          ><label for="gender"
            ><input type="radio" name="gender" value="f" />Female</label
          >
        </fieldset>
        <fieldset>
          <legend>Account Details</legend>
          <label for="email">Email:</label
          ><input type="email" id="email" name="email" required /><br /><label
            for="tel"
            >Tel:</label
          ><input type="tel" id="tel" name="tel" maxlength="11" /><br /><label
            for="password"
            >Password:</label
          ><input
            type="password"
            id="password"
            name="password"
            placeholder="create a password"
            minlength="8"
            required
          />
          <br />
          <label for="course">Course:</label
          ><select name="course" id="course">
            <optgroup>
              <option value="mts">Mathematics</option>
              <option value="chm">Chemistry</option>
              <option value="phs">Physics</option>
              <option value="sts">Statistics</option>
              <option value="csc">ComputerScience</option>
            </optgroup>
          </select>
        </fieldset>
        <label for="complaint">Talk to us</label
        ><textarea name="complaint" id="complaint" rows="5"></textarea><br />
        <label
          ><input type="checkbox" name="agree" required />I agree to the terms
          and conditions</label
        ><br /><button type="submit">Register</button><br /><button
          type="reset"
        >
          Clear
        </button>
      </form>
    </main>
  </body>
</html>
